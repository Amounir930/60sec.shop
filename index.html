<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60sec.shop | Premium Domain for Sale</title>
    <meta name="description" content="Premium domain name 60sec.shop for sale. The perfect digital identity for Q-Commerce, rapid delivery apps, instant checkout, and speed-optimized retail.">
    <script>
        (function() {
            var lang = navigator.language || navigator.userLanguage || 'en';
            lang = lang.toLowerCase();
            if (lang.startsWith('ar')) {
                window.location.replace('ar/index.html');
            } else if (lang.startsWith('pt')) {
                window.location.replace('pt/index.html');
            } else {
                window.location.replace('en/index.html');
            }
        })();
    </script>
    <style>
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #ffffff;
            text-decoration: none;
        }
        .logo span {
            color: #ff3b30;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ff3b30;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #ff3b30;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><span>60sec</span>.shop</div>
        <div class="spinner"></div>
        <p>Redirecting you to the correct language version...</p>
        <p>If you are not redirected automatically, please choose a language:</p>
        <p>
            <a href="en/index.html" id="link-en">English</a> &bull;
            <a href="ar/index.html" id="link-ar">العربية</a> &bull;
            <a href="pt/index.html" id="link-pt">Português</a>
        </p>
    </div>
</body>
</html>
